<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
<!-- por cima das casas do tabuleiro do Dragão e por baixo das pedras (style.css: .jg-tab.tb-dragao::after):
     os olhos queimando através do tabuleiro e as brasas subindo. O desenho de trás é o tabuleiro-dragao.svg -->
<style>
.brasas circle{opacity:0;animation:sobe linear infinite}
.olho{transform-box:fill-box;transform-origin:50% 50%;animation:pisca 7s ease-in-out infinite}
@keyframes pisca{0%,90%,100%{transform:scaleY(1)}93%{transform:scaleY(.08)}96%{transform:scaleY(1)}}
.luz{animation:luz 2.8s ease-in-out infinite}
@keyframes luz{0%,100%{opacity:.75}50%{opacity:1}}
@keyframes sobe{0%{opacity:0;transform:translate(0,0)}12%{opacity:1}70%{opacity:.85}100%{opacity:0;transform:translate(var(--dx),var(--sobe))}}
</style>
<defs><radialGradient id="a"><stop offset="0" stop-color="#fffbe0"/><stop offset=".3" stop-color="#fff2b0"/><stop offset="1" stop-color="#fff2b0" stop-opacity="0"/></radialGradient><radialGradient id="b"><stop offset="0" stop-color="#fffbe0"/><stop offset=".3" stop-color="#ffb347"/><stop offset="1" stop-color="#ffb347" stop-opacity="0"/></radialGradient><radialGradient id="c"><stop offset="0" stop-color="#fffbe0"/><stop offset=".3" stop-color="#ff6a1a"/><stop offset="1" stop-color="#ff6a1a" stop-opacity="0"/></radialGradient><radialGradient id="olhoCor" cx=".55" cy=".5" r=".62"><stop offset="0" stop-color="#fffbd0"/><stop offset=".3" stop-color="#ffe04a"/><stop offset=".72" stop-color="#ff7a0a"/><stop offset="1" stop-color="#a81800"/></radialGradient><radialGradient id="olhoAura"><stop offset="0" stop-color="#ff8a1a" stop-opacity=".55"/><stop offset="1" stop-color="#ff3a0a" stop-opacity="0"/></radialGradient><g id="olhoDir"><ellipse class="luz" cx="474" cy="306" rx="62" ry="34" fill="url(#olhoAura)"/><path d="M418 300C450 276 496 258 548 262L536 282C496 280 458 292 430 314Z" fill="#1c0403"/><path d="M420 298C452 276 498 262 546 264" fill="none" stroke="#ff8a4a" stroke-opacity=".45" stroke-width="1.6"/><path d="M430 320Q462 286 520 288Q494 330 430 320Z" fill="#060000"/><g class="olho"><path d="M436 317Q464 291 514 292Q490 325 436 317Z" fill="url(#olhoCor)"/><ellipse cx="477" cy="305" rx="3.6" ry="13" fill="#140000" transform="rotate(14 477 305)"/><circle cx="490" cy="297" r="2.4" fill="#fff" opacity=".85"/></g></g></defs>
<use href="#olhoDir"/>
<use href="#olhoDir" transform="matrix(-1 0 0 1 800 0)"/>
