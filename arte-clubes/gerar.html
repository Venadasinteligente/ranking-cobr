<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Gerar imagens dos times</title>
<style>
  body { margin: 0; padding: 20px; background: #0e0e10; color: #eee; font: 15px/1.4 system-ui, sans-serif; }
  h2 { margin: 18px 0 4px; font-size: 16px; }
  a { color: #ffb347; display: inline-block; margin: 4px 12px 4px 0; }
  img { max-width: 160px; margin: 8px; background: #333; vertical-align: middle; }
</style>
</head>
<body>
<!-- Os tabuleiros e as pedras dos times brasileiros usam imagens prontas (WebP) feitas dos SVGs das pastas
     de cada time: desenho em SVG ou degradê o navegador refaz a cada jogada e a partida pesa (igual o Dragão).
     Mudou um SVG? Abra esta página pelo site (ex.: http://localhost/arte-clubes/gerar.html), baixe as imagens
     e troque as .webp na pasta do time (o nome baixado é time-arquivo.webp). -->
<p>Gerando…</p>
<div id="saida"></div>
<script>
  const TIMES = ['corinthians', 'flamengo', 'saopaulo', 'palmeiras', 'santos', 'vasco'];
  const LISTA = [
    { nome: 'tabuleiro', lado: 1080, q: 0.86, fundo: true },
    { nome: 'pedra-b', lado: 160, q: 0.92 },
    { nome: 'pedra-p', lado: 160, q: 0.92 },
  ];
  function carregar(src) {
    return new Promise((ok, erro) => { const i = new Image(); i.onload = () => ok(i); i.onerror = erro; i.src = src; });
  }
  window.gerar = async () => {
    const res = {};
    for (const t of TIMES) for (const x of LISTA) {
      const img = await carregar(`${t}/${x.nome}.svg`);
      const c = document.createElement('canvas');
      c.width = c.height = x.lado;
      const g = c.getContext('2d');
      if (x.fundo) { g.fillStyle = '#111'; g.fillRect(0, 0, x.lado, x.lado); }
      g.drawImage(img, 0, 0, x.lado, x.lado);
      res[`${t}/${x.nome}`] = c.toDataURL('image/webp', x.q);
    }
    return res;
  };
  window.gerar().then((res) => {
    document.querySelector('p').textContent = 'Pronto. Baixe e troque as .webp na pasta de cada time:';
    const s = document.getElementById('saida');
    let time = '';
    for (const [nome, url] of Object.entries(res)) {
      const t = nome.split('/')[0];
      if (t !== time) { time = t; const h = document.createElement('h2'); h.textContent = t; s.append(h); }
      const a = document.createElement('a'); a.href = url; a.download = nome.replace('/', '-') + '.webp'; a.textContent = nome + '.webp';
      const im = document.createElement('img'); im.src = url; im.alt = nome;
      s.append(a, im, document.createElement('br'));
    }
  });
</script>
</body>
</html>
